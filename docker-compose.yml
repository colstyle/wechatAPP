version: '3.8'

services:
  db:
    image: mysql:5.7
    container_name: time-capsule-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root_password}
      MYSQL_DATABASE: ${DB_NAME:-celestial_prod}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: time-capsule-api
    restart: always
    ports:
      - "8000:80"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD:-root_password}
      - DB_NAME=${DB_NAME:-celestial_prod}
      - APP_ENV=prod
    depends_on:
      - db
    env_file:
      - backend/.env
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mysql_data:
